<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hangar</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    // 防闪烁：渲染前同步应用主题
    (function () {
      var mode = localStorage.getItem("hangar_theme") || "system";
      var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Hangar</h1>
      <span id="auth-state">
        <button id="btn-login" class="btn-sm">登录</button>
      </span>
    </div>
    <div class="header-right">
      <div class="theme-picker" id="theme-picker">
        <button id="theme-trigger" class="theme-trigger" type="button" title="主题">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M22.6 11.29L20 8.69V5c0-.55-.45-1-1-1h-3.69l-2.6-2.6a.996.996 0 0 0-1.41 0L8.69 4H5c-.55 0-1 .45-1 1v3.69l-2.6 2.6a.996.996 0 0 0 0 1.41L4 15.3V19c0 .55.45 1 1 1h3.69l2.6 2.6c.39.39 1.02.39 1.41 0l2.6-2.6H19c.55 0 1-.45 1-1v-3.69l2.6-2.6c.39-.39.39-1.03 0-1.42m-4.68 1.69a6 6 0 0 1-3.88 4.66c-1.21.43-2.41.45-3.5.18c-.41-.1-.48-.65-.13-.9C11.98 15.84 13 14.04 13 12s-1.02-3.84-2.58-4.92c-.35-.24-.29-.79.13-.9c1.09-.27 2.29-.25 3.5.18c2.02.72 3.54 2.54 3.88 4.66c.05.33.07.66.07.98c-.01.32-.03.65-.08.98"/></svg>
        </button>
        <div class="theme-menu hidden" id="theme-menu">
          <button data-mode="system" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M10.85 12.65h2.3L12 9zM20 8.69V4h-4.69L12 .69L8.69 4H4v4.69L.69 12L4 15.31V20h4.69L12 23.31L15.31 20H20v-4.69L23.31 12zM14.3 16l-.7-2h-3.2l-.7 2H7.8L11 7h2l3.2 9z"/></svg>
            系统
          </button>
          <button data-mode="light" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M20 8.69V4h-4.69L12 .69L8.69 4H4v4.69L.69 12L4 15.31V20h4.69L12 23.31L15.31 20H20v-4.69L23.31 12zM12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6s6 2.69 6 6s-2.69 6-6 6m0-10c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4s-1.79-4-4-4"/></svg>
            浅色
          </button>
          <button data-mode="dark" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M10 4c4.41 0 8 3.59 8 8s-3.59 8-8 8c-.34 0-.68-.02-1.01-.07C10.9 17.77 12 14.95 12 12s-1.1-5.77-3.01-7.93C9.32 4.02 9.66 4 10 4m0-2c-1.82 0-3.53.5-5 1.35C7.99 5.08 10 8.3 10 12s-2.01 6.92-5 8.65C6.47 21.5 8.18 22 10 22c5.52 0 10-4.48 10-10S15.52 2 10 2"/></svg>
            深色
          </button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- 列表视图 -->
    <section id="view-list">
      <div class="toolbar">
        <div class="filters" id="filters">
          <select id="f-status"><option value="">状态：全部</option></select>
          <select id="f-storage"><option value="">位置：全部</option></select>
          <select id="f-grade"><option value="">级别：全部</option></select>
          <select id="f-category"><option value="">类别：全部</option></select>
          <select id="f-owner"><option value="">归属：全部</option></select>
          <select id="f-tag"><option value="">标签：全部</option></select>
          <select id="f-display">
            <option value="">展示：全部</option>
            <option value="true">展示中</option>
            <option value="false">未展示</option>
          </select>
        </div>
        <input type="search" id="f-q" placeholder="搜索名称…">
        <button id="btn-filter" class="btn-sm filter-toggle" type="button">筛选 <span id="filter-count" class="filter-count hidden">0</span></button>
        <button id="btn-refresh" class="btn-sm">刷新</button>
        <button id="btn-add" class="btn primary">+ 新增</button>
      </div>
      <p id="readonly-hint" class="muted hidden">当前为只读模式，登录后可新增 / 编辑 / 删除。</p>
      <div class="table-wrap">
        <table id="models-table">
          <thead>
            <tr>
              <th>照片</th><th>编号</th><th>名称</th><th>类别</th><th>级别</th><th>比例</th>
              <th>限定</th><th>来源</th><th>状态</th><th>存放</th><th>展示</th>
              <th>归属</th><th>完成日期</th><th>标签</th><th>操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="list-empty" class="muted hidden">暂无数据。</p>
    </section>

    <!-- 新增/编辑视图 -->
    <section id="view-form" class="hidden">
      <h2 id="form-title">新增模型</h2>
      <form id="model-form">
        <div class="grid">
          <label>编号 <input name="id" placeholder="留空自动生成（M001…）"></label>
          <label>名称 * <input name="name" required></label>
          <label>类别 * <select name="category" required></select></label>
          <label>级别 <input name="grade" list="dl-grade"></label>
          <label>官方货号 <input name="item_no"></label>
          <label>比例 <input name="scale" list="dl-scale" placeholder="如 1/144"></label>
          <label>限定类型 * <input name="limited" required list="dl-limited"></label>
          <label>来源 * <input name="origin" required list="dl-origin"></label>
          <label>状态 * <select name="status" required></select></label>
          <label>存放位置 * <input name="storage" required list="dl-storage"></label>
          <label>归属 * <input name="owner" required list="dl-owner"></label>
          <label>购买日期 <input name="purchase_date" class="date-text" type="text" inputmode="numeric" autocomplete="off" placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}" title="格式 YYYY-MM-DD"></label>
          <label>完成日期 <input name="done_date" class="date-text" type="text" inputmode="numeric" autocomplete="off" placeholder="YYYY-MM-DD" pattern="\d{4}-\d{2}-\d{2}" title="格式 YYYY-MM-DD"></label>
          <label class="check"><input name="display" type="checkbox"> 展示中</label>
          <label class="full">标签（最多 3 个）
            <span class="tag-input" id="tag-input">
              <input type="text" id="tag-text" list="dl-tag" placeholder="输入后回车添加" autocomplete="off">
            </span>
          </label>
          <datalist id="dl-tag"></datalist>
          <label class="full">照片（保存时上传）<input type="file" id="form-photos" accept=".jpg,.jpeg,.png,.webp,.gif" multiple></label>
          <div id="form-photo-preview" class="photo-preview hidden"></div>
          <label class="full">评价 / 备注 <textarea name="comment" rows="3"></textarea></label>
        </div>
        <datalist id="dl-grade"></datalist>
        <datalist id="dl-limited"></datalist>
        <datalist id="dl-origin"></datalist>
        <datalist id="dl-storage"></datalist>
        <datalist id="dl-owner"></datalist>
        <datalist id="dl-scale"></datalist>
        <div class="form-actions">
          <button type="submit" class="btn primary">保存</button>
          <button type="button" id="btn-cancel" class="btn">返回</button>
        </div>
      </form>
    </section>

    <!-- 详情视图已改为模态框（见 #detail-modal） -->
  </main>

  <footer id="app-footer">
    <span class="muted">Hangar v1.0.0</span>
  </footer>

  <!-- 详情模态框 -->
  <div id="detail-modal" class="modal-mask hidden">
    <div class="modal detail-modal">
      <div class="detail-head">
        <h3 id="detail-title"></h3>
        <button id="btn-detail-close" class="detail-close" type="button" title="关闭（Esc）">×</button>
      </div>
      <div class="detail-scroll">
        <div id="detail-body" class="detail-grid"></div>
        <div id="detail-photos">
          <div class="photos-head">
            <h3>照片</h3>
            <div class="photos-tools hidden" id="photos-tools">
              <span id="upload-status" class="muted"></span>
              <button id="btn-upload" class="btn-sm" title="上传照片"><span class="up-label">上传照片</span><svg class="up-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="m3 16l4.47-4.47a1.81 1.81 0 0 1 2.56 0L14 15.5m1.5 1.5L14 15.5m7 .5l-2.47-2.47a1.81 1.81 0 0 0-2.56 0L14 15.5"/><path d="M12 2.5c-4.23 0-6.345 0-7.747 1.198q-.3.256-.555.555C2.5 5.655 2.5 7.77 2.5 12s0 6.345 1.198 7.747q.256.3.555.555C5.655 21.5 7.77 21.5 12 21.5s6.345 0 7.747-1.198q.3-.256.555-.555C21.5 18.345 21.5 16.23 21.5 12m-6-6.5c.59-.607 2.16-3 3-3s2.41 2.393 3 3m-3-2.5v6.5"/></g></svg></button>
              <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.webp,.gif" multiple class="hidden">
            </div>
          </div>
          <div id="photos-grid" class="photos"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 大图 lightbox -->
  <div id="lightbox" class="modal-mask hidden">
    <button id="lb-prev" class="lb-nav lb-prev" title="上一张（←）">‹</button>
    <div class="lb-main">
      <img id="lightbox-img" src="" alt="">
      <div id="lb-info" class="lb-info"></div>
    </div>
    <button id="lb-next" class="lb-nav lb-next" title="下一张（→）">›</button>
  </div>

  <!-- 登录模态框 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div class="modal">
      <h3>登录</h3>
      <p class="muted">输入 API Token 以解锁编辑权限。</p>
      <input type="password" id="login-token" placeholder="API Token" autocomplete="off">
      <p id="login-error" class="login-error hidden"></p>
      <div class="form-actions">
        <button id="btn-login-submit" class="btn primary">登录</button>
        <button id="btn-login-cancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <div id="toast" class="hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
